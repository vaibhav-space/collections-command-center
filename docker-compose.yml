services:
  postgres:
    image: postgres:16-alpine
    container_name: financeops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: financeops
      POSTGRES_PASSWORD: financeops_secret_password
      POSTGRES_DB: financeops_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financeops -d financeops_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financeops-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://financeops:financeops_secret_password@postgres:5432/financeops_db?schema=public"
      GOOGLE_GENERATIVE_AI_API_KEY: "${GOOGLE_GENERATIVE_AI_API_KEY:-}"
      GEMINI_MODEL: "${GEMINI_MODEL:-gemini-2.0-flash}"
      NEXT_PUBLIC_APP_URL: "${NEXT_PUBLIC_APP_URL:-http://localhost:3000}"
      NODE_ENV: "production"
      AUTO_SEED: "true"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
